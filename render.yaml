# Render Blueprint: free Docker web service for the Momentalk live demo.
# The free Postgres is created separately in the Render dashboard; paste its Internal Database URL
# into DATABASE_URL so moments survive restarts (see backend/app/persist.py).
services:
  - type: web
    name: momentalk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
